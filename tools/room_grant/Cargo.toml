[package]
name = "room-grant-tool"
description = "Lists, makes and takes back the grants standing in the room a turn answers, on the account service, each made on a message of the turn and read back from the record."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "room-grant-tool"
path = "src/main.rs"
test = false

# The crate's tests stand in the root package's harness, so the library's own test target holds none: left
# on, every test build compiles the whole library a second time for an empty binary.
[lib]
test = false
doctest = false

[dependencies]
chrono.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tool-call = { path = "../../crates/tool-call" }
