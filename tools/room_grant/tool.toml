# The grants standing in the room a turn answers, read, made and taken back on the account service, each made on a
# message of the turn whose sender the service judges, and read back from the record the room's GRANTS IN FORCE
# are composed from (docs/tools.md, 「The room grants」).
[tool]
name = "room_grant"
protocol = 1
language = "rust"
build = 'cargo build --release -p room-grant-tool && cp "$BMO_CARGO_TARGET/release/room-grant-tool" "$BMO_TOOL_OUT/"'
check = 'cargo test -p agency-checks --test main tools::'
run = ["room-grant-tool"]

[[entry]]
namespace = "bmo"
name = "room_grant"
title = "Room grants"
description = "List, make or take back what the owner allows a person or the members of the room this turn answers: the record its GRANTS IN FORCE are read from. A grant or a revocation is made on the owner's message of this turn and read back from the record; it is in force only once the row answered shows it. Where the account service refuses, its words are answered as it gave them."
input = "room_grant.json"
hints = { open_world = true }
capabilities = ["room.tools"]

[entry.listing]
line = "- room_grant — list, grant or take back what the owner allows a person or this room's members here, read back from the record"
order = 10
