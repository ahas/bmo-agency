[package]
name = "delegate-tool"
description = "Hands a supervisor's task to a run of a role, its own double where it names none, on a slot of that role with no time bound, and answers with the words it wrote and the files it created or changed."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "delegate-tool"
path = "src/main.rs"
test = false

[dependencies]
chrono.workspace = true
policy = { path = "../../crates/policy" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tool-call = { path = "../../crates/tool-call" }
