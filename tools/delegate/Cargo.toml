[package]
name = "delegate-tool"
description = "Hands a chat agent's task to the helper on a co-worker seat, as a turn of the helper's own session with no time bound, and answers with the words it wrote and the files it created or changed."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "delegate-tool"
path = "src/main.rs"
test = false

[dependencies]
chrono.workspace = true
dotenvy.workspace = true
policy = { path = "../../crates/policy" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tool-call = { path = "../../crates/tool-call" }
