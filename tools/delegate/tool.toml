# A chat agent hands a task to the helper on a co-worker seat, as a turn of the helper's own session with no
# time bound (docs/tools.md, 「The delegate」; docs/agent-control.md, 「Delegating a task to the helper」). The
# entry is unbounded: a call waits in the pool's line and on the turn as long as they take, and is run with
# bmo use --async so its end wakes the agent.
[tool]
name = "delegate"
protocol = 1
language = "rust"
build = 'cargo build --release -p delegate-tool && cp "$BMO_CARGO_TARGET/release/delegate-tool" "$BMO_TOOL_OUT/"'
check = 'cargo test -p agency-checks --test tools'
run = ["delegate-tool"]
timeout = 60

[[entry]]
namespace = "bmo"
name = "delegate"
title = "Delegate a task"
description = "Hand a task that needs no queue item to the helper on a co-worker seat, run with no time limit, and answer with what it wrote and the files it created or changed: run as bmo use bmo/delegate --async so its end wakes you in the room."
input = "delegate.json"
hints = { open_world = true }
capabilities = ["room.tools"]
unbounded = true

[entry.listing]
line = "- delegate — hand a task with no item to the helper on a co-worker seat, and read what it wrote and changed"
order = 5
