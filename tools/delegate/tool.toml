# A supervisor hands a task to a run of a role — its own double, the delegator role, where it names none — on a
# slot of that role with no time bound, and lists the tasks it has delegated (docs/tools.md, 「The delegate」;
# docs/role-slots.md, 「A delegated task」). A delegation waits in the role's line and on the run as long as
# they take, and is run with bmo use --async so its end wakes the supervisor.
[tool]
name = "delegate"
protocol = 1
language = "rust"
build = 'cargo build --release -p delegate-tool && cp "$BMO_CARGO_TARGET/release/delegate-tool" "$BMO_TOOL_OUT/"'
check = 'cargo test -p agency-checks --test main tools::'
run = ["delegate-tool"]

[[entry]]
namespace = "bmo"
name = "delegate"
title = "Delegate a task"
description = "Hand a task that needs no queue item to a run of a role — your own double where you name none — under a one-line title, run with no time limit, and answer with what it wrote and the files it created or changed: run as bmo use bmo/delegate --async so its end wakes you in the room."
input = "delegate.json"
hints = { open_world = true }
capabilities = ["room.tools"]

[entry.listing]
line = "- delegate — hand a task with no item to a run of a role, your own double by default, and read what it wrote and changed"
order = 5

[[entry]]
namespace = "bmo"
name = "delegations"
title = "List my delegations"
description = "List the tasks you delegated: each one's title, its stage (waiting for a slot, running, ended), its role, the provider and model it runs on, when it was asked and, once ended, what it came to; the waiting and running ones first, then the latest ended."
input = "delegations.json"
hints = { read_only = true }
capabilities = ["room.tools"]

[entry.listing]
line = "- delegations — list the tasks you delegated, each with its title, stage, role, road and start"
order = 6
