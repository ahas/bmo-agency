# The supervisor tops the DeepSeek balance up by the amount the owner names, with the card saved in the console's
# secret store (docs/tools.md, 「The DeepSeek top-up」). DeepSeek takes no payment by machine, so a call that
# passes every check answers what a person does on its platform and pays nothing. The card is the platform's own:
# a call runs only under the administrator's grant.
[tool]
name = "deepseek_top_up"
protocol = 1
language = "rust"
build = 'cargo build --release -p deepseek-top-up-tool && cp "$BMO_CARGO_TARGET/release/deepseek-top-up-tool" "$BMO_TOOL_OUT/"'
check = 'cargo test -p agency-checks --test main tools::'
run = ["deepseek-top-up-tool"]

[[entry]]
namespace = "bmo"
name = "deepseek_top_up"
title = "Top the DeepSeek balance up"
description = "Top the DeepSeek balance up by the amount the owner names, in the currency DeepSeek keeps the balance in, with the card saved in the console's secret store; call it only when the owner asks for a top-up. One call is held to a cap. DeepSeek takes no payment by machine, so the answer says what a person does on its platform, the amount paid and the balance as its reader last read it."
input = "deepseek_top_up.json"
capabilities = ["room.tools"]
grant = "platform.payment"

[entry.listing]
line = "- deepseek_top_up — top the DeepSeek balance up by the amount the owner names; it says what a person does where DeepSeek takes no payment by machine"
order = 9
