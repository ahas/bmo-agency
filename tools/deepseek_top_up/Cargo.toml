description = "Tops the DeepSeek balance up by the amount the owner names, paying on DeepSeek's web platform in the machine's own browser with the card and login saved in the console's secret store."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "deepseek-top-up-tool"
path = "src/main.rs"
test = false

[dependencies]
