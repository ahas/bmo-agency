description = "Tops the DeepSeek balance up by the amount the owner names, with the card saved in the console's secret store, or says what a person does where DeepSeek takes no payment by machine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "deepseek-top-up-tool"
path = "src/main.rs"
