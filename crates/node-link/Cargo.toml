[package]
name = "node-link"
description = "The node link: what the two ends of a link between machines say to each other, and the two ends."
version.workspace = true
edition.workspace = true
publish = false

# Its binary holds no tests of its own, so `cargo test` links no test binary of it.
[[bin]]
name = "node-link"
path = "src/main.rs"
test = false

[dependencies]
base64.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "io-std"] }
