[package]
name = "llm-gateway"
description = "The model gateway: the front every run asks, serving the registered models through a LiteLLM child."
version.workspace = true
edition.workspace = true
publish = false

# Its binary holds no tests of its own, so `cargo test` links no test binary of it.
[[bin]]
name = "llm-gateway"
path = "src/main.rs"
test = false

[dependencies]
axum.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
store = { path = "../store" }
tokio.workspace = true
url.workspace = true
