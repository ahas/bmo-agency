# The gates and where each stands against a chat turn. Every
# gate stands here and the list of gates is read from it, so a gate cannot be added without a place.
# What each gate runs on is its route, which lives with every other work key's in the fallback
# profiles and the archive's route table.
#
# A turn part is a list of steps in the order a turn passes them; a step holds the places of the gates
# the turn starts together and waits on together. A place names its gate, and the one condition its
# step runs under where it runs in some turns only.

# The off-turn part: the gates that run outside any chat turn, in the order the console lists them.
apart = ["people-standing", "document-seek", "translator", "voice-polish", "voice-reading"]

# The gates whose runs' cost is written under their own names, and which the usage screen reads back:
# the ones that record their spend themselves, retired ones among them, whose recorded runs are still
# read.
usage = [
  "content-judge",
  "output-format",
  "output-decide",
  "output-verify",
  "system-documents",
  "room-rules",
  "library-knowledge",
  "sanitizer",
  "voice-polish",
  "voice-reading",
]

# Pre-gates: the gates that run before the chat agent writes its reply.

[[pre]]
places = [{ key = "session-summary", condition = "fresh-session" }]

# The three gates that pick a turn's reference, one library each, are marked as such:
# every roster that lists a gate reads the three of them from these
# marks.
[[pre]]
places = [
  { key = "system-documents", reference = true },
  { key = "room-rules", reference = true },
  { key = "library-knowledge", reference = true },
  { key = "people-search" },
  { key = "situation-rules" },
]

[[pre]]
places = [{ key = "sanitizer" }]

# Post-gates: the gates that run after the reply is written, before it reaches the room.

[[post]]
places = [{ key = "sanitizer" }]

[[post]]
places = [{ key = "output-format", condition = "folding-dialect" }]
