# The names under a worker's workbench agency keeps (docs/worker-bench.md, 「An item's scratch」): the
# folder that holds each item's scratch, one folder per item number, and what an item's own database on
# the store's cluster is named from, the item number and an underscore following it. What a job's
# prompt says of them is the caller's.

[workbench]
scratch = "items"
item_database = "bmo_item_"

# How much of its item's notes a job's prompt carries (docs/api.md, 「assignments and jobs」): the newest notes
# that fit these bytes, and the line saying how many older ones were left out, with `{n}` their count.
[notes]
most_bytes = 4096
left_out = "{n} older notes are left out of this prompt; they stand on the item."

# What opens a job's prompt under its title where checkouts of other repositories are lent to it
# (docs/worker-slots.md, 「A checkout lent to a job」): the heading, the line before the list, and one line a
# checkout, with `{repository}`, `{path}` and `{branch}`.
[lent]
heading = "## Checkouts lent to this job"
lead = "Each of these repositories' checkouts is this job's until it ends, standing on the job's branch. Work, commit and close there as in this job's own checkout; one close closes them all, each named by a --checkout."
line = "- `{repository}`: `{path}`, on `{branch}`"
