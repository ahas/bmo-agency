# How a job's reports are examined by its orderer before the job goes on or ends (docs/job-review.md): how many
# times the work is sent back before it may be put to the owner, how long the owner's question waits before the
# job gives its checkout up, the name the record's own entries are written under, the two checks in their order
# with what each requires, what the orderer is told, and what each turn the review asks for is told. Each line
# names the marks it is filled with.
escalate_after = 10
owner_wait_seconds = 600
actor = "agency"
# What the orderer is told: `{job}`, `{item}`, `{worker}`, `{stage}`, `{round}`, `{rejections}`, `{check}`,
# `{requirement}`, `{heading}`, `{words}` and `{moves}`.
review_order = "The job {job} of item #{item} on {worker} is under review: {stage}, round {round}, its work sent back {rejections} times so far.\n\nThe check due now is {check}: {requirement}\n\n{heading}\n\n{words}\n\nAnswer with review_job on job {job}: {moves}."
moves_early = "ask, reject or pass"
moves_open = "ask, reject, pass or escalate"
report_heading = "The worker's report:"
answer_heading = "The worker's answer to your question:"
ruling_heading = "The owner's word on it:"
# The stage named in an order and on the owner's question: `{stage}`, `{stages}` and `{step}`.
stage_one = "its one stage"
stage_of = "stage {stage} of {stages} ({step})"
stage_final = "its final report, every stage passed"
# A job that gave its checkout up while the owner's question waits: `{job}`, `{item}`, `{question}` and `{worker}`.
parked_order = "The job {job} of item #{item} waits on the owner's question #{question}, past its due time, so it gave its checkout {worker} up; the item stays leased. Launch the work that can go now."
# The owner's question: `{words}`, `{job}`, `{item}`, `{stage}` and `{rejections}`.
question_text = "{words}\n\nThe job {job} of item #{item} ({stage}) had its work sent back {rejections} times, and its review puts it to you."
send_back = "Send the work back"
take_it = "Take the work as it stands"
# The review opened as the job is launched: `{stages}`, how many, and `{plan}`, the steps a line each.
opened = "The work runs in {stages} stage(s), each examined before the next:\n{plan}"
# What the first turn of a job of several stages is told after its prompt: `{stages}`, `{plan}` and `{step}`.
first_stage = "## Stages\n\nThis job runs in {stages} stages, one at a time. Each stage ends with your report, which the supervisor that ordered the work examines before the next stage is handed to you in this same session:\n{plan}\n\nDo stage 1 alone now: {step}\n\nEnd this turn with your report of stage 1."
# What every turn of a job of one stage is told after its prompt.
one_stage = "## Review\n\nEnd this turn with your report. The supervisor that ordered the work examines it, and may question you, send the work back or pass it, each as a new turn in this same session."
# A stage handed over once the one before passed: `{passed}`, `{stage}`, `{stages}`, `{last}` and `{step}`.
next_stage = "The review passed stage {passed}. Do stage {stage} of {stages} now{last}: {step}\n\nEnd this turn with your report of stage {stage}."
last_stage = ", the last stage"
# The turn asking for the final report once every stage passed.
final_turn = "Every stage passed its review. Write the final report of the whole job now: every stage, what each changed and how it was checked, the commits, and every matter left to the owner with why it is the owner's. Do no further work in this turn."
# A question of the review: `{check}` and `{words}`.
question_turn = "The supervisor examining your report asks, on its check {check}:\n\n{words}\n\nAnswer it in this turn. Where the question shows work missing, do that work before you answer, and say what you did."
# The work sent back: `{words}`.
rejection_turn = "The supervisor examining your report sent the work back:\n\n{words}\n\nDo what it asks now, in this checkout, then end this turn with your report of the work as it stands after it."
# Opens a turn's prompt where the job's session could not be resumed: `{prompt}` the job's own, then the record.
carried = "{prompt}\n\n## The review so far\n\nThis job's session could not be resumed, so its record stands here, oldest first:\n\n{record}"

# The checks every report is examined by, in order, each with what it requires.
[[checks]]
name = "promises"
requirement = "Every item the work committed to was carried out: the brief, the stage's step, every rework the review sent back, and each thing the report itself says it would do; nothing of it was left for later."

[[checks]]
name = "decisions"
requirement = "Every matter the report leaves to the owner, or calls the owner's to decide, stands on a ground that makes it the owner's: a decision only the owner can give. A matter the worker could settle from the work, the rules and the documents is not the owner's."
