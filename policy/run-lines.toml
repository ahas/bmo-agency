# The lines agency runs, named for what the run is for rather than for the program that carries it: a
# room's turn of any conversational agent, a judgement, a job, a search, a browse
# (docs/launch-lines.md, docs/agents.md). One table to a line, read by every side that composes a run of it.
#
# needs: what its program has to offer for the line to go out on it. The runners' tools are agency's own
#   MCP servers and the co-worker gate, so a program that cannot withhold its own tools or gate each
#   call does not carry them; every other line goes out on whatever program its road names.
# keeps_session: whether its turns follow one another on one session.
# composes_typed_lines: whether a line a person types into the line's standing program is handed, by
#   the place's submit hook, the composition a turn the deployment puts in would carry.
# capabilities: what every run of the line may reach of the tool host, whoever it runs for;
#   absent on a line whose runs hold only what their
#   agent's role gives (docs/agent-roles.md), or that is handed no tools.
# namespaces: the tool host namespaces a run of the line is issued; absent on a line that is handed no
#   tools.
# shown: the placed tool entries, by full name, every run of the line is shown by name in their namespace
#   whatever its agent's role, where it holds them; every other entry it holds is reached with `bmo use`.
#   Each must be an entry the tool host's registry holds, which no build can read (docs/policy.md, 「A
#   line's shown entries」).
# variables: the deployment's variables every run of the line hands its record, each where the deployment
#   sets it, for the placed tools that read them: a record's variable wins over the tool host's own.

[chat]
needs = []
keeps_session = true
composes_typed_lines = true
capabilities = ["room.tools", "gate.translate", "gate.reference", "deploy"]
namespaces = ["bmo", "gate", "eye", "testbed", "voice"]
shown = [
  "bmo/brain_fold", "bmo/brain_consolidated", "bmo/brain_episode", "bmo/brain_learn", "bmo/brain_list",
  "bmo/brain_move", "bmo/brain_similar", "bmo/brain_unconsolidated", "bmo/say", "bmo/worker_ask",
  "gate/translate", "gate/reference_index", "gate/reference_piece", "gate/reference_search",
]
# The CLI's own web search and fetch, and its Artifact tools, are never shown to the chat: explorer and
# artifact are the chat line's own servers.
tools_denied = ["WebSearch", "WebFetch", "Artifact", "ArtifactCheck", "ArtifactComments", "ArtifactData"]
# The gate's address and the path of its token file, which the gate's translate tool calls it with.
variables = ["BMO_GATE_URL", "BMO_GATE_TOKEN_FILE"]

[gate]
needs = []
keeps_session = false

# A translation asked of the translator runner (docs/launch-lines.md, 「Translate runner」): no tools, no
# session, the purpose's instructions as its system prompt.
[translate]
needs = []
keeps_session = false

# tools_denied: what its program is never shown — the CLI's web tools, its Artifact tools, the
#   claude.ai Docs connector, named by its server so every tool it serves is covered, and the tools that
#   bring a session back after its turn has ended, which a job, whose turn's end is its answer, has no
#   use for.
[worker]
needs = []
keeps_session = true
namespaces = ["web", "worker"]
shown = [
  "web/web_fetch", "web/web_search", "worker/graph_get", "worker/graph_impact", "worker/graph_search",
  "worker/todo_show",
]
tools_denied = [
  "WebSearch", "WebFetch", "Artifact", "ArtifactCheck", "ArtifactComments", "ArtifactData",
  "mcp__claude_ai_Claude_Docs", "Monitor", "ScheduleWakeup", "CronCreate", "CronDelete", "CronList",
]

# A branch goes out on the search line, its record narrowed to what its research settings open.
# The brain tools it holds are the chat agent's own memory (docs/agent-roles.md, 「The searcher role's
# bundles」): the record names the chat agent, the default answerer, as the turn its brain tools write, so a research
# run establishes what it found in the same brain the chat agent reads.
[search]
needs = ["tool-gate", "mcp-only-tools"]
keeps_session = false
capabilities = ["room.chat"]
namespaces = ["bmo", "web"]
shown = ["bmo/brain_learn", "bmo/brain_similar", "web/danawa_search", "web/exchange_rate", "web/github_issue", "web/huggingface_model", "web/iwedding_product", "web/naver_blog", "web/read_rulebook", "web/reddit", "web/research_branch", "web/view_image", "web/web_fetch", "web/web_search"]
brain_agent = true

[browse]
needs = ["tool-gate", "mcp-only-tools"]
keeps_session = false
capabilities = ["room.chat"]
namespaces = ["bmo", "web"]
shown = ["bmo/brain_learn", "bmo/brain_similar", "web/danawa_search", "web/exchange_rate", "web/github_issue", "web/huggingface_model", "web/iwedding_product", "web/naver_blog", "web/read_rulebook", "web/reddit", "web/research_branch", "web/view_image", "web/web_fetch", "web/web_search"]
brain_agent = true

