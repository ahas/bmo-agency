# The words of the one road resolution (docs/cache-fallback.md, 「One road resolution」): why a provider
# cannot answer now, why a login of it cannot, the sentence a closed road is refused or held with, the line
# a job launched again on the next road is opened with and its report's account of where it ran, and how
# often a job waiting for a road asks again. A provider's own words, the place its balance is topped up
# among them, stand in that provider's file.

[reasons]
# A provider the owner turned off, as a pinned key that heads its walk with it is told.
off = "the owner turned it off"
# A provider that offers a balance, its last reading at or below zero.
balance = "its balance is spent ({amount} {currency} left)"
# A provider that holds logins, none of the logins the key may go out on open; each login's own reason
# follows it.
no_login = "no login of it is open"

[logins]
# One login's own reason, by what closes it.
off = "{account} is turned off"
resting = "{account} is at its limit until {until}"
person = "{account} waits for a person to sign in again"
key = "{account} has no key in its key file"
balance = "{account} has spent its balance"

[closed]
# The sentence a closed road is refused or held with: its head, one line for each provider, the moment
# the first road that waits for a window reopens, and what a person does to reopen the first a person can.
head = "No provider of the order can answer now."
provider = "{provider}: {reason}"
reopens = "The first road reopens on its own at {at}."
person = "To reopen {provider} now: {command}"

[job]
# The line a job's prompt is opened with as it goes out again on the next road, ahead of its own words.
continued = "This job already ran on {from}, which stopped answering ({why}). Its work so far stands in this checkout: read what is there — the branch, its commits and what is left uncommitted — and carry the job on from there; never start it over."
# The line its report ends with where it went out on more than one road, and each road's part of it.
moved = "The job ran on {roads}."
road = "{road} until it stopped answering ({why})"
# How often a job waiting for a road asks the resolution again, in seconds.
wait_seconds = 60
