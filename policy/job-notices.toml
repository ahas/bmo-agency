# What an item's orderer and the owner are told of a change in the queue (docs/agent-control.md, 「An item's
# change is told to its orderer」): how deep the chain of items an item was raised from is followed to find its
# orderer; the order each instruction carries, its marks naming what it is filled with; the word a launch
# notice names where the item goes to any free checkout; and the codes of the owner's notices.
orderer_depth = 16
any_worker = "any free checkout"
paused_order = "Item #{item} ({title}) is open in the queue {queue}, which is paused or under a hold and gives no lease, so it waits on the queue and not on a launch. Say in one line in this room that it waits on the queue; do not work around the queue."
unlaunchable_order = "Item #{item} ({title}) names {assignee} as its repository, which no checkout agency holds is of, so no worker will ever take it. Correct its assigneeName with job_item_update to a repository GET /repositories lists, or say in one line why it stays."
model_order = "Item #{item} ({title}) carries the label model={label}, and its launch was refused: {why}\n\nCorrect the label with job_item_update to a provider and a model agency holds, as <provider>/<model>, or set it to model=auto where the owner named no model, then launch it again; or say in one line why it stays."
moved_order = "Item #{item} ({title}) is now {state}{merged} while its job {job} still runs on {worker}. Only the owner's word stops a job: where its work is no longer wanted, put the stop of job {job} to him; otherwise say in one line that the job runs on and its end will be told."
closed_order = "Item #{item} ({title}) was closed as done by {by}, not by you. Relay it in one line in this room where the asker waits for it; nothing is left to do on it."
question_order = "A run asked question #{question} on item #{item}: {text}\nChoices: {choices}\n\nRead it with job_question and its replies with job_replies, put it to the owner in his own chat, and never answer it for him."
waiting_order = "The job of item #{item} on {worker} waits: {why}\n\nIt goes on by itself once it can. Say in one line in this room that it waits and why, where the asker waits for it."
close_order = "The job of item #{item} ended, and item #{item} is still leased under lease {lease}: it is not closed. Write its final report and set it done, which ends the lease; where it is not to close, give lease {lease} back so it is open again."
question_due_code = "job-question-due"
failed_code = "job-failed"
