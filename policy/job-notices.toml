# What an item's orderer and the owner are told of a change in the queue (docs/agent-control.md, 「An item's
# change is told to its orderer」): how deep the chain of items an item was raised from is followed to find its
# orderer; the data each order carries, its marks naming what it is filled with; the word a launch notice
# names where the item goes to any free checkout; and the codes of the owner's notices. An order carries the
# change's data and a short marker, never an instruction: what to do with each kind stands in the
# supervisor's manual (prompts/agents/chat/manual.md, 「THE QUEUE」).
orderer_depth = 16
any_worker = "any free checkout"
paused_order = "Item #{item} ({title}) is open in the queue {queue}, which is paused or under a hold and gives no lease."
unlaunchable_order = "Item #{item} ({title}) names {assignee} as its repository, which no checkout agency holds is of."
agent_order = "Item #{item} ({title}) carries the label agent={label}, and its launch was refused: {why}"
# An open item whose model no agent of its role that is switched on runs: `{item}`, `{title}`, `{model}`,
# `{role}` and `{agents}`, the role's agents with their roads a line each.
no_candidate_order = "Item #{item} ({title}) names model={model} for the {role} role, and no agent of that role that is switched on runs that model. The agents of the {role} role:\n{agents}"
moved_order = "Item #{item} ({title}) is now {state}{merged} while its job {job} still runs on {worker}."
closed_order = "Item #{item} ({title}) was closed as done by {by}."
# The labels a held item names what it waits on with, one item's number or several separated by commas; and
# what its orderer is told once every item it waits on is done and none waits to go live: `{item}`, `{title}`,
# `{label}` and `{waited}`, the items it waited on, each as `waited_item` gives it with `{item}`, `{title}` and
# `{state}`.
wait_labels = ["follows", "waiting-on"]
wait_ended_order = "Item #{item} ({title}) is held under {label}, and every item it waits on has ended: {waited}."
waited_item = "#{item} ({title}), {state}"
# An item whose closes merged commits that wait for their repositories' batch deployments: `{item}`, `{title}`
# and `{merged}`, each waiting commit as `merged_commit` gives it with `{commit}` and `{repository}`, joined by
# a semicolon.
deploy_order = "Item #{item} ({title}): its job's close merged {merged}, and the item waits for each repository's batch deployment: put each live once no related work is left, and close the item once every one is live, as the todo procedure says."
merged_commit = "commit {commit} into {repository}'s main"
# A repository's batch deployment come due (docs/agent-control.md, 「A repository's batch deployment come due is
# told」): how many minutes the oldest commit waiting for it waits before its orderer is told, unless the owner's
# own settings row `deploy_due_minutes` names another; how often the items under a close are read for it; and its
# order, `{repository}`, `{age}`, the oldest commit's wait, `{due}`, the due minutes as a wait, and `{commits}`,
# each waiting commit as `deploy_due_commit` gives it with `{commit}`, `{item}`, `{title}` and `{age}`, joined by a
# semicolon.
deploy_due_minutes = 180
deploy_due_read_seconds = 60
deploy_due_order = "The oldest commit waiting for {repository}'s batch deployment has waited {age}, and a commit waits at most {due}. The commits waiting: {commits}"
deploy_due_commit = "commit {commit} of item #{item} ({title}), waiting {age}"
# A deployment that ended without going live (docs/agent-control.md, 「A deployment that did not go live is
# told」): `{repository}`, `{commit}`, `{unit}`, `{outcome}`, `{stage}`, `{reason}`, `{items}`, the waiting items
# it carries in the room, each as `deploy_failed_item` gives it with `{item}` and `{title}`, else
# `deploy_failed_no_items`, and `{journal}`, the last lines of its unit's journal. The words stand in for a run cut
# off with no outcome, one that named no stage, and one that gave no reason. How often the progress records are
# read, and how many lines of a unit's journal the order carries.
deploy_failed_order = "The deployment of {repository} at commit {commit} (unit {unit}) ended {outcome} without going live, in the stage {stage}: {reason}\nThe waiting items it carries: {items}\nThe last lines of its journal:\n{journal}"
deploy_failed_item = "#{item} ({title})"
deploy_failed_no_items = "none of the items waiting for this repository's batch deployment"
deploy_cut_off = "cut off"
deploy_no_stage = "none named"
deploy_no_reason = "its run gave no reason"
deploy_read_seconds = 5
deploy_journal_lines = 20
question_order = "A run asked question #{question} on item #{item}: {text}\nChoices: {choices}"
waiting_order = "The job of item #{item} on {worker} waits: {why}\n\nIt goes on by itself once it can."
close_order = "The job of item #{item} ended, and item #{item} is still leased under lease {lease}: it is not closed."
question_due_code = "job-question-due"
failed_code = "job-failed"
# Agency's outbox: how often its sender sends what is due; the wait after a failed try, doubled after each
# failure up to the most; how long a standing notice waits after it was last told before it is told again; and
# how long one try waits for the receiver's answer.
send_seconds = 5
retry_first_seconds = 5
retry_most_seconds = 300
retell_seconds = 300
answer_seconds = 30
# How long after a job's end, a check of its review coming due or its wait beginning, the sender waits before it
# owes a notice of it that was not owed yet itself: past the time the change's own path takes to owe it.
owe_grace_seconds = 120
