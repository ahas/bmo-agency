# An account's isolation node on this machine (docs/account-isolation.md): its name, the system user it runs as and
# that user's home, and the sandbox every program of it runs in. The scope these words hold changes on the owner's
# direct word alone (docs/account-isolation.md, 「Who may change it」).

# The isolation node of an account is this prefix and the account's id.
node_prefix = "account-"

# The system user an isolation node runs as is this prefix and the account's id; its home stands under the base.
user_prefix = "bmo-account-"
home_base = "/home"

# The folder in the home the link's two sockets stand in, owned by the owner's user and shared with the account's
# group alone.
link_folder = "link"

# The folder in the home every program of the node sees as /tmp and /var/tmp.
scratch_folder = "tmp"

# How long after a setup of an isolation node that left something missing agency's server stands it up again by
# itself, in seconds.
setup_again_seconds = 3600

# The folder that stands only where systemd is the system manager, which the sandbox's transient units need.
system_manager_mark = "/run/systemd/system"

# The words every program of an isolation node is started under, ahead of its own command line: a transient unit of
# the system manager's, started with sudo by the owner's user, running as the account's user with the whole file tree
# read-only but the home, every other home, /root and every user's runtime folder hidden under empty read-only
# folders, its scratch folder as its temporary folders, a shared-memory folder of its own and no new privileges. Standard input and output are the caller's, and a program it leaves
# standing outlives the command that started it. {user} is the account's user, {home} its home, {scratch} its
# scratch folder and {path} the search path its programs are handed.
sandbox = [
  "sudo", "-n", "systemd-run", "--quiet", "--pipe", "--wait", "--collect",
  "--uid={user}", "--gid={user}", "--working-directory={home}",
  "--setenv=HOME={home}", "--setenv=USER={user}", "--setenv=LOGNAME={user}", "--setenv=SHELL=/bin/bash",
  "--setenv=PATH={path}",
  "--property=ProtectSystem=strict",
  "--property=TemporaryFileSystem=/home:ro /root:ro /run/user:ro",
  "--property=BindPaths={home}",
  "--property=BindPaths={scratch}:/tmp {scratch}:/var/tmp",
  "--property=TemporaryFileSystem=/dev/shm:mode=1777",
  "--property=NoNewPrivileges=yes",
  "--property=KillMode=process",
  "--",
]

# The programs that make an isolation node's user, its home and its folders, run as root by these paths and never
# by a name a search path resolves; the setup refuses a machine where one does not stand at its path.
[user_programs]
useradd = "/usr/sbin/useradd"
chmod = "/usr/bin/chmod"
setfacl = "/usr/bin/setfacl"
install = "/usr/bin/install"
