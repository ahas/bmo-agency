# The clock a job turn's tool calls are held to (docs/agent-control.md, 「A job turn's tool calls are held
# to a clock」), read by the door that carries the turn. A call that has burned no processor for its stall
# is stopped, so a blocked read or write on a pipe or a socket cannot hold the turn for ever. A call that is
# working is never stopped however long it runs: a build or a test that keeps burning processor time is
# left to finish.

[call]
# How long a call goes before the clock watches it at all. A call shorter than this is a short one.
min_seconds = 180

# How long a call's process tree may burn no processor time before the call is stopped.
stall_seconds = 300

# How often the call's process tree is read.
look_seconds = 10

# How long a call with no process of its own may run before it is cut. A call that waits inside the
# program on a socket or a pipe leaves nothing in the tree to read, so nothing says whether it is
# working. A job's program reads this bound as its MCP idle window, and aborts a silent call inside
# itself, handing the model a failed result; a call that window does not cover is cut by words put into
# the working turn, and the program ends the waiting call and hands the model a failed result.
in_process_seconds = 300

# After such a call is cut, how long it may still stand unanswered before the turn is ended at a bound of
# its own, so a program that cannot take the words does not hold its item.
in_process_grace_seconds = 120

# The words put into the working turn when a call with no process of its own is cut. `{tool}` is the
# call's tool and summary, `{seconds}` its age at the cut.
in_process_cut = "The tool call {tool} did not complete: it was cut after {seconds} seconds with no process of its own and no answer. Nothing it would have returned is coming. Go on with the work without its result, and call a tool again only where the work cannot go on without one."

# Why a job's turn was cut at the bound after a cut call did not take the words. `{tool}` is the call and
# `{seconds}` the grace it was given.
in_process_grace_cut = "cut at its bound after a tool call did not take its cut: the job's turn held its item without ending, so its item is released for a rerun"

# When the first still-running line is written for a call, and how often it is repeated.
log_after_seconds = 30
still_every_seconds = 60

# On a stop, how long a running call may burn no processor time before it is stopped, so the stop's words
# can be read at the next tool boundary.
stop_stall_seconds = 5

# A stop the job has not ended with itself within this long is ended by the surface's interrupt.
stop_bound_seconds = 600

[turn]
# A job turn past this clock is cut and its item released, so a turn held by something the call clock
# cannot see does not keep its item and the queue behind it. It is generous: a working job does not reach
# it, and the call clock catches a blocked call in minutes.
bound_minutes = 240

# Why a job's turn was cut at its bound, in the job's report. `{minutes}` is the bound in minutes.
cut = "cut at its {minutes}-minute bound: the job's turn held its item without ending, so its item is released for a rerun"
