# The idle queue's alarm (docs/agent-control.md, 「An idle queue is told to the owner」): how long no job may
# start while approved work waits and a worker is free before the owner is told, how often it is looked
# for, the code the owner's notice carries, and what the supervisor is asked to do about it; and how long an
# approved item may wait on its own free worker before the supervisor is told of it alone, with the order it
# is told, `{item}`, `{title}` and `{worker}` marking what it carries; and, for a draft awaiting approval,
# how much of its brief the supervisor is told, in lines and at most in characters, and the order it is told,
# `{item}`, `{title}`, `{raised_by}`, `{repository}` and `{brief}` marking what it carries.
idle_minutes = 5
check_seconds = 60
code = "queue-idle"
ask = "Launch the next waiting item now, as your TODO procedure (procedures/todo.md) sets it: take its lease with job_lease_next, choose its worker with assign_worker, then run_job. Where none can be launched, tell the owner why in one line."
launch_seconds = 60
launch_order = "Item #{item} ({title}) awaits a launch on {worker}: lease it (job_lease_next), assign its worker (assign_worker), run it (run_job), or say in one line why not."
draft_brief_lines = 6
draft_brief_chars = 800
draft_order = "Item #{item} ({title}) is a draft awaiting approval. Raised by: {raised_by}. Repository: {repository}. Its brief begins:\n{brief}\n\nJudge it by your manual: read it whole with job_item; where the work is routine and you can judge it safe, approve it with job_item_update, the approval recorded as your own, and say so in this room with its number and why; otherwise leave it a draft and say in one line why the owner should decide."
