# The idle queue's alarm (docs/agent-control.md, 「An idle queue is told to the owner」): how long no job may
# start while approved work waits and a worker is free before the owner is told, how often it is looked
# for, the code the owner's notice carries, and the short marker it carries; and how long an approved item
# may wait on its own free worker before the supervisor is told of it alone, with the data it is told,
# `{item}`, `{title}` and `{worker}` marking what it carries; and, for a draft awaiting approval, how much
# of its brief the supervisor is told, in lines and at most in characters, and the data it is told,
# `{item}`, `{title}`, `{raised_by}`, `{repository}` and `{brief}` marking what it carries. What to do with
# each kind stands in the supervisor's manual (prompts/agents/chat/manual.md, 「THE QUEUE」).
idle_minutes = 5
check_seconds = 60
code = "queue-idle"
ask = "The queue is idle."
launch_seconds = 60
launch_order = "Item #{item} ({title}) awaits a launch on {worker}."
# How long after one of a free agent's items is told its next is told, while the agent stays free and nothing
# was launched on it (docs/agent-control.md, 「An item's change is told to its orderer」).
next_offer_seconds = 60
draft_brief_lines = 6
draft_brief_chars = 800
draft_order = "Item #{item} ({title}) is a draft awaiting approval. Raised by: {raised_by}. Repository: {repository}. Its brief begins:\n{brief}"
