# The handoff a supervisor's session going away is asked for before a fresh session replaces it
# (docs/sessions.md, 「A restart hands the session over」): how long agency waits before asking again while
# one is under way, and the reasons it names, each by what makes the session go. The ask itself waits for
# the receiver's answer however long it takes.
retry_seconds = 5
# How often agency looks again whether an asynchronous call asked under a replaced supervisor program's tool
# record still runs, before it takes that record back.
calls_look_seconds = 30

[reasons]
lost = "the kept session is gone: the program no longer holds it"
replaced = "a fresh session replaces the one the agent had"
moved = "the documents the session's prompt is composed from changed"
