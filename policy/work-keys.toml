# Agency's work keys and the profile each starts on (docs/cache-fallback.md, 「The canonical name of a road
# is the work key, not a Claude model name」). The keys are the stable names callers, the archive and
# the console share: one for the chat agent, one for all job workers (their launch line is common), one for each
# gate in the gate order, and one for each editor. Every gate of the gate order has a profile here,
# and nothing else does.
#
# A profile's values are defaults only: an owner's explicit choice is an archive row and survives a
# later change here. The small classification and summary gates start on the registry's provider, on
# the registration their tier maps to there; the deeper reading gates, the chat agent, the worker and the editors
# start on auto. The person book's two gates, the reference gates and the knowledge classifier are
# keys of their own, so a provider chosen for one never moves the others under the owner.
#
# Each profile names its key, the label a screen shows, its kind (bmo, worker, gate or editor), the
# run line it goes out on, the road it takes where the owner wrote none, the tier it starts on, and
# the Claude and Codex choices the tier store's first seed drew on. A gate may add:
# - laya_mode: its Laya mode where the owner chose none; a gate
#   without one has no probe;
# - laya_road: Laya may be its provider, since its probe reads every verdict it gives;
# - laya_each: Laya settles it one question at a time;
# - laya_safe: its probe names a safe verdict, which lets it be filtered asymmetrically;
# - switchable: the owner may switch it off, since its caller has a way of its own without it;
# - holds_no_session: its turns are asked about a session rather than held as one;
# - gate_answer_tokens: the room its answer is given, where its answer is not the shape the common
#   default was measured against (docs/own-llm.md);
# - gate_sampling: how its request with no tools samples, each setting by the name the engine reads
#   it under (docs/own-llm.md, 「Sampling per gate」): a verdict at 0.1, a faithful rewrite at 0.3, a
#   polished one at 0.5, none of them the chat's;
# - gate_pool: the most programs its pool stands on Claude Code, where its callers keep more parts out at
#   once than the pool's default bound.
# An editor may add answer_floor and thinking_answer_floor (docs/own-llm.md, 「Answer slots」).

[[profile]]
key = "bmo"
label = "Chat agent"
kind = "bmo"
line = "chat"
default_route_mode = "auto"
default_claude_model = "claude-opus-5"
tier = "Supervisor"
default_codex = { model = "gpt-5.6-sol", effort = "xhigh" }

[[profile]]
key = "job-worker"
label = "Job worker"
kind = "worker"
line = "worker"
default_route_mode = "auto"
default_claude_model = "claude-opus-5"
tier = "Frontier"
default_codex = { model = "gpt-5.6-sol", effort = "max" }

[[profile]]
key = "system-documents"
label = "System document classifier"
gate_sampling = { temperature = 0.1, top_p = 0.8, top_k = 20, min_p = 0 }
kind = "gate"
line = "gate"
default_route_mode = "registered"
default_claude_model = "claude-haiku-4-5-20251001"
tier = "Simple"
default_codex = { model = "gpt-5.6-luna", effort = "low" }
laya_mode = "shadow"
laya_road = true
laya_each = true

[[profile]]
key = "room-rules"
label = "Room rule classifier"
gate_sampling = { temperature = 0.1, top_p = 0.8, top_k = 20, min_p = 0 }
kind = "gate"
line = "gate"
default_route_mode = "registered"
default_claude_model = "claude-haiku-4-5-20251001"
tier = "Simple"
default_codex = { model = "gpt-5.6-luna", effort = "low" }
laya_mode = "shadow"
laya_road = true
laya_each = true

[[profile]]
key = "library-knowledge"
label = "Library knowledge classifier"
gate_sampling = { temperature = 0.1, top_p = 0.8, top_k = 20, min_p = 0 }
kind = "gate"
line = "gate"
default_route_mode = "registered"
default_claude_model = "claude-haiku-4-5-20251001"
tier = "Simple"
default_codex = { model = "gpt-5.6-luna", effort = "low" }
laya_mode = "shadow"
laya_road = true
laya_each = true

[[profile]]
key = "people-search"
label = "People book search"
gate_sampling = { temperature = 0.1, top_p = 0.8, top_k = 20, min_p = 0 }
kind = "gate"
line = "gate"
default_route_mode = "registered"
default_claude_model = "claude-haiku-4-5-20251001"
tier = "Simple"
default_codex = { model = "gpt-5.6-luna", effort = "low" }
laya_mode = "shadow"
laya_road = true
laya_each = true

# The matcher stands beside the reference gates rather than among them, and takes the same road: its
# own model, its own row, and Laya watching in the shadow.
[[profile]]
key = "situation-rules"
label = "Situation rule matcher"
gate_sampling = { temperature = 0.1, top_p = 0.8, top_k = 20, min_p = 0 }
kind = "gate"
line = "gate"
default_route_mode = "registered"
default_claude_model = "claude-haiku-4-5-20251001"
tier = "Simple"
default_codex = { model = "gpt-5.6-luna", effort = "low" }
laya_mode = "shadow"
laya_road = true

[[profile]]
key = "sanitizer"
label = "Sanitiser gate"
gate_sampling = { temperature = 0.1, top_p = 0.8, top_k = 20, min_p = 0 }
kind = "gate"
line = "gate"
default_route_mode = "registered"
default_claude_model = "claude-haiku-4-5-20251001"
tier = "Simple"
default_codex = { model = "gpt-5.6-luna", effort = "low" }
laya_mode = "off"
laya_safe = true

# The formatting gate decides the fold alone, and Laya answers it: the model a road would run it on is
# what it stands on only where somebody puts it on one.
[[profile]]
key = "output-format"
label = "Output format gate"
gate_sampling = { temperature = 0.1, top_p = 0.8, top_k = 20, min_p = 0 }
kind = "gate"
line = "gate"
default_route_mode = "laya"
default_claude_model = "claude-haiku-4-5-20251001"
tier = "Simple"
default_codex = { model = "gpt-5.6-luna", effort = "low" }
laya_mode = "shadow"
laya_road = true

# This gate's answer is a person's whole standing sheet, which its own ceilings let run to 8,000
# characters; Korean at that length is over 6,000 tokens.
[[profile]]
key = "people-standing"
label = "People book summariser"
gate_sampling = { temperature = 0.3, top_p = 0.8, top_k = 20, min_p = 0 }
kind = "gate"
line = "gate"
default_route_mode = "registered"
default_claude_model = "claude-haiku-4-5-20251001"
tier = "Simple"
default_codex = { model = "gpt-5.6-luna", effort = "low" }
gate_answer_tokens = 8192
gate_pool = 4

[[profile]]
key = "document-seek"
label = "Document seek gate"
gate_sampling = { temperature = 0.1, top_p = 0.8, top_k = 20, min_p = 0 }
kind = "gate"
line = "gate"
default_route_mode = "registered"
default_claude_model = "claude-haiku-4-5-20251001"
tier = "Simple"
default_codex = { model = "gpt-5.6-luna", effort = "low" }

# The translator's answer is the whole part it was given, rendered; parts are cut small enough that
# this holds one with room to spare, so the first of them shows within seconds.
[[profile]]
key = "translator"
label = "Translator"
gate_sampling = { temperature = 0.3, top_p = 0.8, top_k = 20, min_p = 0 }
kind = "gate"
line = "gate"
default_route_mode = "registered"
default_claude_model = "claude-sonnet-5"
tier = "Reliable"
default_codex = { model = "gpt-5.6-terra", effort = "high" }
gate_answer_tokens = 2048
gate_pool = 4

# Its answer is the whole script said again, which a long answer of the chat agent's makes long. A full reading
# without it is the mechanical script, which is already right to say, so it may be switched off.
[[profile]]
key = "voice-polish"
label = "Voice polish gate"
gate_sampling = { temperature = 0.5, top_p = 0.8, top_k = 20, min_p = 0 }
kind = "gate"
line = "gate"
default_route_mode = "auto"
default_claude_model = "claude-sonnet-5"
tier = "Reliable"
default_codex = { model = "gpt-5.6-terra", effort = "high" }
gate_answer_tokens = 8192
switchable = true

[[profile]]
key = "voice-reading"
label = "Voice reading gate"
gate_sampling = { temperature = 0.3, top_p = 0.8, top_k = 20, min_p = 0 }
kind = "gate"
line = "gate"
default_route_mode = "auto"
default_claude_model = "claude-sonnet-5"
tier = "Reliable"
default_codex = { model = "gpt-5.6-terra", effort = "high" }

# An editor writes a whole piece, sheet or document in one tool call, so its answer has room for the
# longest of them past whatever a registration gives a turn. A thinking model drafts the pieces it
# means to write in its thinking before it writes them, which alone overran 16,384 tokens on a
# person-book batch of a registered thinking model (docs/own-llm.md, 「Answer slots」).
[[profile]]
key = "digest"
label = "Digest"
kind = "editor"
line = "editor"
default_route_mode = "auto"
default_claude_model = "claude-sonnet-5"
tier = "Reliable"
default_codex = { model = "gpt-5.6-terra", effort = "high" }
answer_floor = 16384
thinking_answer_floor = 65536

[[profile]]
key = "people-digest"
label = "People book writer"
kind = "editor"
line = "editor"
default_route_mode = "auto"
default_claude_model = "claude-sonnet-5"
tier = "Reliable"
default_codex = { model = "gpt-5.6-terra", effort = "high" }
answer_floor = 16384
thinking_answer_floor = 65536
