# What a research run's settings open and what a search run is bound by: the part of the research
# settings agency reads as it launches one (docs/launch-lines.md). The settings themselves, their keys and
# their checks, are the caller's.

# The most places one pool bucket may hold.
pool_capacity_most = 128

# The capabilities a run's research settings open, each with the run variable that opens it: the variable
# opens its capability where it names at least one comma-separated item other than "0", and a run carrying
# no research setting at all holds none of them. The launch leaves what this table withholds out of the
# session record.
[opens]
"web.images" = "BMO_RESEARCH_IMAGES"
"web.branches" = "BMO_RESEARCH_TOOLS"
"web.rulebooks" = "BMO_RESEARCH_RULEBOOKS"

# What a search run's standing instructions carry after its task (docs/launch-lines.md):
# the rulebooks a search is bound by, in this order, each named as it stands under the rules; the ones
# binding only some searches, which are given by the one section deciding whether each applies and read
# whole from the web server once it says it does; and that section's heading.
[search]
rulebooks = ["search-kinds", "product-search", "restaurant-search", "investment-search", "study-material", "deep-dives"]
on_request = ["product-search", "restaurant-search", "investment-search", "study-material", "deep-dives"]
applies_section = "Whether this rulebook applies at all"

# The rounds a research line asks the same session after its first answer (docs/launch-lines.md, 「A
# research run's rounds」): the questions by name, each a rule the session is asked, and the lines that
# ask them. A line's list ends in `final` and holds it nowhere else. `ceiling_seconds` bounds the whole
# process from the first answer; past it the line's `past_ceiling` says what happens: `final` asks the
# final question at once, `last` returns the answer the session had already written.
[draft.questions]
what = "Decide what this task must establish: the question it asks, each part of that question, and what would count as an answer. Say plainly what the sources this run may read cannot reach."
sources = "Name the sources the answer needs: the kind of page or document each fact can come from, and the search wordings that reach them. Read them with the web tools; a page the run did not read is not a source."
facts = "Check every fact the answer rests on against a second source where one exists, and mark what only one source states. Nothing undecided may stand as known: a value the run could not read is unknown, never guessed."
coverage = "Check the answer against the task: every part of the question answered, each fact carrying the source it came from, and what could not be confirmed said plainly. Name what still has to be found."
establish = "Write the facts and knowledge this run established into the shared brain with brain_learn, each with its source, after brain_similar shows the rows like it: a duplicate is confirmed or strengthened, a contradiction is closed. Then say which rows were written."
final = "Write the result now: the whole answer to the task, in the form the task asks for, resting only on the facts established above and citing the sources read. This answer is the run's result."

[draft.lines.search]
rounds = ["what", "sources", "facts", "coverage", "establish", "final"]
ceiling_seconds = 900
past_ceiling = "final"

[draft.lines.browse]
rounds = ["what", "sources", "facts", "coverage", "establish", "final"]
ceiling_seconds = 900
past_ceiling = "final"
