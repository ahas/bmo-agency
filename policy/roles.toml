[[roles]]
name = "transliterator"
label = "Transliterator"
description = "Spells the written words of a line as the spoken words the voice unit asks for, using no tool."
line = "search"
max_concurrent = 4
bundles = []
order = [
  { provider = "claude-code", model = "claude-haiku-4-5-20251001", effort = "low" },
  { provider = "deepseek", model = "deepseek-flash", effort = "low" },
]

# Upkeep: the role agency's own runs hold where they stand for no one's work, the usage reader's renewal turn
