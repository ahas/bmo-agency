# The roles and what is no role's own (docs/agent-roles.md). The roles themselves are the store's rows,
# which the owner adds and changes on the control port; this file seeds them once and keeps the rest.
#
# job: the role a job runs as where its item names none (docs/repositories.md, 「A job」).
# delegate: the role a delegated task runs as where its ask names none: the supervisor's double
#   (docs/tools.md, 「The delegate」).
# renewal: the role agency's own runs hold that stand for no one's work, the usage reader's renewal turn and a
#   judging batch among them (docs/agents.md, 「A run in a pane of its own」).
# translate: the role a translation agency is asked for runs as (docs/agent-roles.md, 「The translator and the
#   transliterator roles」).
# send: the bundle that opens sending into a room, which every guard of a send reads here.
# supervisor: the bundles every supervisor's session record holds (docs/supervisors.md, 「The bundles a
#   supervisor holds」).
# name_pattern, name_most: the shape of a role's name, kebab-case, and the most characters it holds.
# label_most: the most characters a role's label holds.
# quota_share: the remaining quota at or below which a provider of an order is passed over, where a row sets
#   none (docs/provider-order.md, 「What an order is」).
# [icons]: the mark a screen shows beside every supervisor, every role and every repository.
# [[bundles]]: one function bundle a role may give, a capability of the tool host, with the short name a
#   screen writes it by. A role gives no bundle this file does not declare.
# [[roles]]: the roles a store is given once by name, in the order a screen lists them: each one's name, its
#   label, its line, the bundles it gives, its cap, the file under prompts/roles/ whose text is its prompt or
#   the co-worker definition under prompts/agents/worker/coworkers/ whose body is its prompt and whose
#   description is its description, the one sentence that is its description where it names no definition,
#   whether its runs keep their sessions, whether a run may call it as a co-worker, and its provider order,
#   each entry a provider once with the model, the effort and the thinking it runs on there, or none for a
#   role that follows the supervisor asking it. Its compaction threshold is its first provider's declared
#   default.

job = "worker"
delegate = "doppelganger"
renewal = "upkeep"
translate = "translator"
send = "room.send"
supervisor = ["room.chat", "room.send", "web.read"]
name_pattern = "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
name_most = 40
label_most = 60
quota_share = 0.01

[icons]
supervisor = "i-material-symbols-chat-bubble-outline"
role = "i-material-symbols-construction"
repository = "i-material-symbols-folder-outline"

[[bundles]]
name = "room.chat"
label = "Memory, notes and TODO"

[[bundles]]
name = "room.send"
label = "Send"

[[bundles]]
name = "graph.read"
label = "Graph"

[[bundles]]
name = "queue.read"
label = "TODO reading"

[[bundles]]
name = "web.read"
label = "Web reading"

[[bundles]]
name = "web.sites"
label = "Site tools"

[[bundles]]
name = "web.branches"
label = "Research branches"

[[bundles]]
name = "web.rulebooks"
label = "Rulebooks"

# The job worker: DeepSeek's flash model first (the owner's decision of 2026-11-02).
[[roles]]
name = "worker"
label = "Worker"
description = "Works one job of a repository's queue in its checkout, from the item's brief to its report, where the item names no other role."
line = "worker"
max_concurrent = 3
bundles = ["graph.read", "queue.read", "web.read"]
order = [
  { provider = "deepseek", model = "deepseek-flash", effort = "high" },
  { provider = "claude-code", model = "claude-opus-5", effort = "high" },
  { provider = "codex", model = "gpt-5.6-sol", effort = "max" },
  { provider = "openrouter", model = "google/gemma-4-31b-it:free" },
]

# The supervisor's double: a delegation naming no role runs as it. Its order is empty, so its runs go out on
# the asking supervisor's own provider, model and effort until the owner sets an order on it
# (docs/role-slots.md, 「A delegated task」).
[[roles]]
name = "doppelganger"
label = "Doppelganger"
description = "The supervisor's double: takes a task the supervisor hands off, holding its tools and going out on its provider, and answers the cause or the decision in plain sentences."
line = "worker"
prompt = "doppelganger.md"
max_concurrent = 2
bundles = ["graph.read", "queue.read", "web.read"]
order = []

# The producer: a role whose items make videos with the video-shotcraft studio, which reads its items, the
# web and sends the finished file into a room (docs/agent-roles.md, 「The producer role」).
[[roles]]
name = "producer"
label = "Producer"
description = "Turns a brief into a finished video with the video-shotcraft studio and sends the file into the item's room."
line = "worker"
prompt = "producer.md"
max_concurrent = 2
bundles = ["queue.read", "web.read", "room.send"]
order = [
  { provider = "claude-code", model = "claude-opus-5", effort = "high" },
  { provider = "codex", model = "gpt-5.6-sol", effort = "max" },
  { provider = "deepseek", model = "deepseek-flash", effort = "high" },
]

[[roles]]
name = "builder"
label = "Builder"
line = "worker"
definition = "builder.md"
max_concurrent = 8
bundles = ["graph.read", "queue.read", "web.read"]
order = [
  { provider = "claude-code", model = "claude-opus-5", effort = "high" },
  { provider = "codex", model = "gpt-5.6-sol", effort = "max" },
  { provider = "deepseek", model = "deepseek-flash", effort = "high" },
]

[[roles]]
name = "verifier"
