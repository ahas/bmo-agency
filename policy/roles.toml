[[roles]]
name = "voyager"
label = "Voyager"
description = "A research run on the search line: searches the web, reads pages, opens branches and reads rulebooks to answer one question."
line = "search"
max_concurrent = 4
bundles = ["web.read", "web.sites", "web.branches", "web.rulebooks"]
sessions = "fresh"
order = [
  { provider = "claude-code", model = "claude-opus-5", effort = "high" },
  { provider = "deepseek", model = "deepseek-flash", effort = "high" },
]

