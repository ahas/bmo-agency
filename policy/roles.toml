# The roles an agent may hold and the function bundles each gives (docs/agent-roles.md), read by every
# side that issues a turn's record, serves its catalogue, guards its sends or sets and shows a role.
#
# [[bundles]]: one function bundle a role may give, a capability of the tool host, with the short name a screen writes it by.
# [[roles]]: one role, in the order a screen lists them: its name, its label as a screen writes it, the
#   bundles it gives, and in `shown` the tool entries, by full name, its agents are shown by name whatever
#   their line; every other entry a session of the role holds is reached with `bmo use` unless the line
#   lists it. None is listed for now.
# coworker: the role a co-worker's run holds. A co-worker is a sub-agent for a worker's use alone, and
#   the place it works in, a standing branch checkout, has no agents row to name a role of its own.
# send: the bundle that opens sending into a room, which every guard of a send reads here.
# [kinds]: the role a row of each kind holds where its writer names none (docs/agent-roles.md, 「Where a
#   role comes from」).

coworker = "worker"
send = "room.send"

[kinds]
chat = "chat"
worker = "worker"
runner = "searcher"
gate = "gate"

# [icons]: the mark a screen shows beside every agent of each kind, by the kind; an agent row's own mark is not
# read, so every agent of one kind looks alike.
[icons]
chat = "i-material-symbols-chat-bubble-outline"
worker = "i-material-symbols-construction"
runner = "i-material-symbols-search"
gate = "i-material-symbols-verified-user-outline"

[[bundles]]
name = "room.chat"
label = "Memory, notes and TODO"

[[bundles]]
name = "room.send"
label = "Send"

[[bundles]]
name = "graph.read"
label = "Graph"

[[bundles]]
name = "queue.read"
label = "TODO reading"

[[bundles]]
name = "web.read"
label = "Web reading"

[[bundles]]
name = "web.sites"
label = "Site tools"

[[bundles]]
name = "web.branches"
label = "Research branches"

[[bundles]]
name = "web.rulebooks"
label = "Rulebooks"

[[roles]]
name = "chat"
label = "Chat"
max_concurrent = 8
bundles = ["room.chat", "room.send", "web.read"]

[[roles]]
name = "worker"
label = "Worker"
max_concurrent = 8
bundles = ["graph.read", "queue.read", "web.read"]

[[roles]]
name = "searcher"
label = "Searcher"
max_concurrent = 4
bundles = ["web.read", "web.sites", "web.branches", "web.rulebooks"]

[[roles]]
name = "translator"
label = "Translator"
prompt = "translator.md"
max_concurrent = 4
bundles = []

[[roles]]
name = "gate"
label = "Gate"
max_concurrent = 8
bundles = []
