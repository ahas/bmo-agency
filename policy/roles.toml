# The roles an agent may hold and the function bundles a role may give (docs/agent-roles.md). The roles
# themselves are the store's rows, which the owner adds and changes on the control port; this file seeds
# them and keeps what is no role's own.
#
# [[bundles]]: one function bundle a role may give, a capability of the tool host, with the short name a
#   screen writes it by. A role gives no bundle this file does not declare.
# [[roles]]: the roles a store is given once by name, in the order a screen lists them: each one's name, its
#   label as a screen writes it, the bundles it gives, the most of its agents that run at once, the file
#   under prompts/roles/ whose text is its prompt, and in `shown` the tool entries, by full name, its agents
#   are shown by name whatever their line; every other entry a session of the role holds is reached with
#   `bmo use` unless the line lists it. None is listed for now. `sessions` says whether the role's runs go on in
#   the session an earlier run left while its cache is warm, `keep`, or each open its own, `fresh`; `keep` where
#   a role names none (docs/agent-roles.md, 「A role's sessions」).
# coworker: the role a co-worker's run holds. A co-worker is a sub-agent for a worker's use alone, and
#   the place it works in, a standing branch checkout, has no agents row to name a role of its own.
# delegate: the role whose agents carry a task a chat agent hands off through bmo/delegate where the ask names
#   none (docs/tools.md, 「The delegate」; docs/agent-roles.md, 「The helper role」). Its seat is asked under
#   it, at the tier its role:<name> assignment gives.
# renewal, judging: the roles agency's own runs hold that stand for no agent row — the usage reader's renewal
#   turn and the gate project's judging batch — whose sessions setting they open their session by
#   (docs/agents.md, 「Runs apart」).
# send: the bundle that opens sending into a room, which every guard of a send reads here.
# name_pattern, name_most: the shape of a role's name, kebab-case, and the most characters it holds.
# label_most: the most characters a role's label holds.
# [kinds]: the role a row of each kind holds where its writer names none (docs/agent-roles.md, 「Where a
#   role comes from」).

coworker = "worker"
delegate = "helper"
renewal = "upkeep"
judging = "gate"
send = "room.send"
name_pattern = "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
name_most = 40
label_most = 60

[kinds]
chat = "chat"
worker = "worker"
runner = "searcher"
gate = "gate"

# [icons]: the mark a screen shows beside every agent of each kind, by the kind; an agent row's own mark is not
# read, so every agent of one kind looks alike.
[icons]
chat = "i-material-symbols-chat-bubble-outline"
worker = "i-material-symbols-construction"
runner = "i-material-symbols-search"
gate = "i-material-symbols-verified-user-outline"

[[bundles]]
name = "room.chat"
label = "Memory, notes and TODO"

[[bundles]]
name = "room.send"
label = "Send"

[[bundles]]
name = "graph.read"
label = "Graph"

[[bundles]]
name = "queue.read"
label = "TODO reading"

[[bundles]]
name = "web.read"
label = "Web reading"

[[bundles]]
name = "web.sites"
label = "Site tools"

[[bundles]]
name = "web.branches"
label = "Research branches"

[[bundles]]
name = "web.rulebooks"
label = "Rulebooks"

[[roles]]
name = "chat"
label = "Chat"
max_concurrent = 8
bundles = ["room.chat", "room.send", "web.read"]

[[roles]]
name = "worker"
label = "Worker"
max_concurrent = 8
bundles = ["graph.read", "queue.read", "web.read"]

[[roles]]
name = "searcher"
label = "Searcher"
max_concurrent = 4
bundles = ["web.read", "web.sites", "web.branches", "web.rulebooks"]
sessions = "fresh"

[[roles]]
name = "translator"
label = "Translator"
prompt = "translator.md"
max_concurrent = 4
bundles = []
sessions = "fresh"

# The video producer: a worker whose items make videos with the video-shotcraft studio, which reads its
# items, the web and sends the finished file into a room (docs/agent-roles.md, 「The video role」).
[[roles]]
name = "video"
label = "Video producer"
prompt = "video.md"
max_concurrent = 2
bundles = ["queue.read", "web.read", "room.send"]

# The helper: the role the chat agent delegates hard work to, carried by a worker row standing in a checkout
# of its own (docs/agent-roles.md, 「The helper role」).
[[roles]]
name = "helper"
label = "Helper"
prompt = "helper.md"
max_concurrent = 2
bundles = ["graph.read", "queue.read", "web.read"]

[[roles]]
name = "gate"
label = "Gate"
max_concurrent = 8
bundles = []
sessions = "fresh"

# Upkeep: the role agency's own upkeep runs hold where they stand for no agent row, the usage reader's renewal
# turn among them (docs/agent-roles.md, 「The roles」).
[[roles]]
name = "upkeep"
label = "Upkeep"
bundles = []
sessions = "fresh"
