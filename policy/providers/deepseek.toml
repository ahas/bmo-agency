# DeepSeek's own API, reached by Claude Code through agency's gateway member, with the key the gateway's
# member names (docs/own-llm.md, 「The gateway's members」). Read by this provider's own declaration on each
# side.

# The provider's name as a screen shows it.
label = "DeepSeek"

# The lines its program carries. Its runs are Claude Code's on the gateway, which carries the chat, a worker's
# job, a gate's one-request judgement and a search's own run.
lines = ["chat", "gate", "worker", "search"]

# A mapping of it carries a ceiling on the answer's tokens: its member names one.
caps_answer_tokens = true

# The share of a model's window a session may fill before it is folded, at a tier the fold-ratio table
# holds no row for (docs/sessions.md, 「Session compaction」): half the window.
fold_ratio = 0.5

[effort]
# Every effort word a mapping of it may hold, in the order a screen shows them. `none` is DeepSeek's
# own word for a run that does not think.
words = ["none", "low", "medium", "high", "max"]
# A mapping may also name no effort, which leaves the word to DeepSeek.
none_held = true
# What a launch makes of the mapping's word: either is taken, and `none` is a launch without thinking.
launch = "either"

[presence]
# The member's key file under the data root's env directory, private to its owner.
key_file = "deepseek.key"
# What it says where the key file or the gateway's key file is not usable: the kebab-case code a screen words
# in its own language, and the English sentence the log keeps.
missing_code = "deepseek-key-unusable"
missing = "DeepSeek cannot be chosen: its member's key file (deepseek.key) or the gateway's key file is missing or its mode is not 0600."
# What a pin or a job naming a model this provider does not serve says; the name follows it.
not_held = "Not a DeepSeek model"

[claude]
# The Claude Code effort word a run goes out with, by the word its tier mapping or its agent named. A word
# this table does not hold leaves the launch at Claude Code's own word for whether the run thinks.
effort = { none = "low", low = "low", medium = "medium", high = "high", max = "max" }

[resident]
# The keys typed into the pane of its standing program, Claude Code, that cut a working turn short
# (docs/agent-control.md, 「Stopping」).
interrupt = ["escape"]
# Its surface carries its own turns: put into Claude Code's transcript door and read back out of its record.
turns = "endpoint"
# Words put in while a turn works are taken into that turn.
words_mid_turn = true
# A conversation grown to its mark is handed over by a turn asking it for its note, which a new session
# opens with.
handover = "handoff"
# A conversation's turn is watched for going nowhere and cut at the conversation limits.
turn_limits = true
# No engine of its own holds a slot; every request goes to DeepSeek's API.
waits_for_engine = false

# The dsh route the road no longer uses; kept for a rollback to the dsh harness, which no run of this build
# names.
[dsh]
api = "https://api.deepseek.com/v1"
api_env = "BMO_DEEPSEEK_DSH_API_URL"
key_env = "DEEPSEEK_API_KEY"
key_file = "deepseek.key"

[balance]
# What the account has left, asked with the road's key file on a clock (docs/usage-windows.md,
# 「Balances」): where it is asked, the variable a test names a stand-in's address in, how often it is read
# and for how many passes a reading stands; and, for a balance spent, where a person tops it up
# (docs/cache-fallback.md, 「One road resolution」).
url = "https://api.deepseek.com/user/balance"
url_env = "BMO_DEEPSEEK_BALANCE_URL"
pass_seconds = 300
fresh_passes = 6
top_up = "top the DeepSeek balance up at https://platform.deepseek.com/top_up"

[top_up]
# The supervisor's tool that tops the balance up by an amount the owner names (docs/tools.md, 「The DeepSeek
# top-up」). DeepSeek takes no payment by machine: its top-up is made only by a person signed in to its
# platform, so the tool checks the call and the card and answers what a person does, and pays nothing.

# The console's kind the card is saved in, one `KEY=VALUE` line to each of these fields. Which secret of the
# platform administrator's space, the data root's `env/`, holds it is agency's setting `deepseekCardSecret`
# (docs/api.md, 「settings」), the owner's to change with no deployment.
card_kind = "card"
card_fields = ["CARD_NUMBER", "CARD_EXPIRY", "CARD_CVC", "CARD_HOLDER_NAME"]

# Why one call is held to a cap, said with the cap where an amount is over it.
cap_reason = "one call tops the balance up by no more than this, so that a mistaken amount or a repeated call cannot spend more; a larger top-up is a person's own, made on DeepSeek's platform"

# The largest amount one call names, by the currency DeepSeek keeps the balance in; a currency this table holds
# no cap for is not topped up.
[top_up.cap]
USD = 50
CNY = 350

# What the tool answers. Each `{name}` is filled in with what it names.
[top_up.words]
# The call named no amount above zero.
no_amount = "Name the amount to top the DeepSeek balance up by: a number above zero, in the currency DeepSeek keeps the balance in."
# Agency's settings could not be read, so the card's secret is unknown.
settings_unasked = "Agency's settings could not be read for the card's secret: {why}"
# Agency's setting names no card secret.
card_unnamed = "No card secret is named for the DeepSeek top-up: fill agency's setting {setting} with the name of the console secret, of the kind {kind}, the card is saved in, then call again."
# The card's secret stands nowhere.
card_missing = "No card is saved for DeepSeek: ask for the secret {secret} in the kind {kind} in the console's secret store, then call again."
# The card's secret lacks fields, named by their keys.
card_lacks = "The card saved as {secret} lacks {fields}: save it again in the kind {kind} with every field filled."
# Agency could not say what the balance reader last read.
balance_unasked = "The DeepSeek balance could not be read from agency: {why}"
# The balance reader has not read the balance, so its currency is unknown.
balance_unread = "The DeepSeek balance has not been read yet, so the currency a top-up is named in is unknown: call again once its balance reader has read it."
# The currency the balance is kept in has no cap.
no_cap = "No single top-up cap is held for {currency}, so no top-up is made in it."
# The amount is over the cap.
over_cap = "{amount} {currency} is over the single top-up cap of {cap} {currency}: {reason}."
# Nothing was paid, and what a person does to top the balance up.
by_person = "Nothing was paid: DeepSeek takes no payment by machine, only from a person signed in to its platform. A person is to {top_up}, adding {amount} {currency} with the card saved as {secret}, and to confirm the payment wherever the card's issuer asks."
# The amount paid and the balance after, as the balance reader last read it.
outcome = "Paid: {paid} {currency}. Balance: {balance} {currency}, as the balance reader last read it at {seen}."
