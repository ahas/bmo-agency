# DeepSeek's own API, reached through Claude Code's Anthropic-compatible endpoint with the key the
# endpoint account holds (docs/cache-fallback.md, 「The DeepSeek road」). Read by this provider's own
# declaration on each side.

# The provider's name as a screen shows it.
label = "DeepSeek"

# The lines its program carries. A gate is another service's to run, and the research lines keep a
# prompt no endpoint model is offered here.
lines = ["chat", "worker", "editor"]

# A mapping of it carries no ceiling on the answer's tokens: the provider publishes none.
caps_answer_tokens = false

# It serves two models, so its co-workers each take their own tier's.
lends_coworkers = true

[effort]
# Every effort word a mapping of it may hold, in the order a screen shows them. `none` is DeepSeek's
# own word for a run that does not think.
words = ["none", "low", "medium", "high", "max"]
# A mapping may also name no effort, which leaves the word to DeepSeek.
none_held = true
# What a launch makes of the mapping's word: either is taken, and `none` is a launch without thinking.
launch = "either"

[presence]
# The endpoint account's key file under the data root's env directory, private to its owner.
key_file = "deepseek.key"
missing = "DeepSeek cannot be chosen: the key file (deepseek.key) is missing or its mode is not 0600."
# What a pin or a job naming a model this provider does not serve says; the name follows it.
not_held = "Not a DeepSeek model"

[endpoint]
# Where DeepSeek speaks the Anthropic Messages API; a test names a stand-in's address in the variable
# below, which wins where it is set.
base_url = "https://api.deepseek.com/anthropic"
base_env = "BMO_DEEPSEEK_API_URL"
# How long one request is waited for: a whole answer at the model's speed.
wait_seconds = 1800

# The models this provider serves, in the order a screen offers them. An id is the model's name on the
# wire, and the window and answer ceiling are the run's own.
[[endpoint.model]]
id = "deepseek-flash"
label = "DeepSeek V4.1 Flash"
context_tokens = 1048576
answer_tokens = 32768
thinking = true

[[endpoint.model]]
id = "deepseek-v4-pro"
label = "DeepSeek V4 Pro"
context_tokens = 1048576
answer_tokens = 32768
thinking = true

[resident]
# The keys typed into the pane of its standing program, Claude Code's own screen, that cut a working
# turn short (docs/agent-control.md, 「Stopping」).
interrupt = ["escape"]
# Its lines run their own turns, read out of the session's transcript; its surface carries none.
turns = "transcript"
# Words put in while a turn works are taken into that turn.
words_mid_turn = true
