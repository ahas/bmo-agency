# DeepSeek's own API, reached by the dsh harness through bmo-tui on its OpenAI-compatible route, with the
# key the road's key file holds (docs/cache-fallback.md, 「The DeepSeek road」). Read by this provider's own
# declaration on each side.

# The provider's name as a screen shows it.
label = "DeepSeek"

# The lines its program carries. A gate's judgements stand in places of their own on it; the research lines
# need a program that gates each call and withholds its own tools, which dsh is not.
lines = ["chat", "gate", "worker"]

# A mapping of it carries no ceiling on the answer's tokens: the provider publishes none.
caps_answer_tokens = false

# It serves two models, so its co-workers each take their own tier's.
lends_coworkers = true

# The share of a model's window a session may fill before it is folded, at a tier the fold-ratio table
# holds no row for (docs/sessions.md, 「Session compaction」): half the window.
fold_ratio = 0.5
# The most tokens a session's context may carry before it is folded, whatever the window: every request of a
# turn reads the whole context again, so the bound is what one answer costs at most.
fold_tokens = 150000

[effort]
# Every effort word a mapping of it may hold, in the order a screen shows them. `none` is DeepSeek's
# own word for a run that does not think.
words = ["none", "low", "medium", "high", "max"]
# A mapping may also name no effort, which leaves the word to DeepSeek.
none_held = true
# What a launch makes of the mapping's word: either is taken, and `none` is a launch without thinking.
launch = "either"

[presence]
# The road's key file under the data root's env directory, private to its owner.
key_file = "deepseek.key"
# What it says where the key file is not usable: the kebab-case code a screen words in its own language,
# and the English sentence the log keeps.
missing_code = "deepseek-key-unusable"
missing = "DeepSeek cannot be chosen: the key file (deepseek.key) is missing or its mode is not 0600."
# What a pin or a job naming a model this provider does not serve says; the name follows it.
not_held = "Not a DeepSeek model"

# The models this provider serves, in the order a screen offers them. An id is the model's name on the
# wire, and the window and answer ceiling are the run's own.
[[model]]
id = "deepseek-flash"
label = "DeepSeek V4.1 Flash"
context_tokens = 1048576
answer_tokens = 32768
thinking = true

[[model]]
id = "deepseek-v4-pro"
label = "DeepSeek V4 Pro"
context_tokens = 1048576
answer_tokens = 32768
thinking = true

[resident]
# The keys typed into the pane of its standing program, bmo-tui, that cut a working turn short
# (docs/agent-control.md, 「Stopping」).
interrupt = ["escape"]
# The program that stands in the agent's pane: bmo-tui, which starts dsh and keeps its screen open on
# the session.
program = "bmo-tui"
dsh = "dsh"
# Its surface carries its own turns: put into bmo-tui's inbox and read back out of its record.
turns = "inbox"
# A turn holds the session until dsh has ended it; words typed mid-turn are not taken into that turn.
words_mid_turn = false

# How its turns go through dsh: its own OpenAI-compatible API as dsh's one route and the variable its key
# is read from, which the program carries from the road's key file.
[dsh]
api = "https://api.deepseek.com/v1"
api_env = "BMO_DEEPSEEK_DSH_API_URL"
key_env = "DEEPSEEK_API_KEY"
key_file = "deepseek.key"

[balance]
# What the account has left, asked with the road's key file on a clock (docs/usage-windows.md,
# 「Balances」): where it is asked, the variable a test names a stand-in's address in, how long an ask may
# take, how often it is read and for how many passes a reading stands; and, for a balance spent, where a
# person tops it up (docs/cache-fallback.md, 「One road resolution」).
url = "https://api.deepseek.com/user/balance"
url_env = "BMO_DEEPSEEK_BALANCE_URL"
ask_seconds = 15
pass_seconds = 300
fresh_passes = 6
top_up = "top the DeepSeek balance up at https://platform.deepseek.com/top_up"
