# The public OpenRouter gateway, reached by the dsh harness with the key in the environment
# (docs/cache-fallback.md, 「The OpenRouter substitute is the dsh road」). Read by this provider's own
# declaration on each side.

# The provider's name as a screen shows it.
label = "OpenRouter"

# The lines its program carries.
lines = ["chat", "gate", "worker", "editor"]

# A mapping of it carries no ceiling on the answer's tokens: the provider publishes none.
caps_answer_tokens = false

# OpenRouter routes to many models, so its co-workers each take their own tier's.
lends_coworkers = true

[effort]
# Every effort word a mapping of it may hold.
words = ["none", "minimal", "low", "medium", "high", "xhigh"]
# A mapping may also name no effort.
none_held = true
# What a launch makes of the mapping's word: none is taken. Which levels a routed model offers is that
# model's, never the tier's, so a mapping naming one is refused rather than launched with a word
# nobody chose for the model behind it.
launch = "refused"
fault = "OpenRouter dsh does not support explicit effort"

[presence]
# The environment variable the key is read from; its value is never held anywhere else.
key_env = "BMO_OPENROUTER_KEY"
missing = "OpenRouter cannot be chosen: BMO_OPENROUTER_KEY is not set."

[gateway]
# Where its API answers: the chat completions dsh's route asks under, and the listing of a model's
# upstreams an upstream's cache is read from. A test names a stand-in's address in the variable below.
api = "https://openrouter.ai/api/v1"
api_env = "BMO_OPENROUTER_API_URL"

[cache]
# The cache belongs to the upstream that actually took a turn, so its lifetime is read by that upstream's
# name as the gateway reports it, then by the longest model name an entry of it begins. Only lifetimes the
# upstream itself publishes are written; an upstream missing here keeps nothing warm (docs/cache-fallback.md).
upstreams = [
  { upstream = "Anthropic", prefix = "anthropic/", ttl_minutes = 60, keepalive_idle_minutes = 40 },
  { upstream = "OpenAI", prefix = "openai/gpt-5.6", ttl_minutes = 30, keepalive_idle_minutes = 20 },
  { upstream = "OpenAI", prefix = "openai/gpt-6", ttl_minutes = 30, keepalive_idle_minutes = 20 },
]

[catalogue]
# Where the model listing is read from, and how long it is given. It needs no key, so a machine given
# none can still show the choice. A test names a stand-in's address in the variable below.
url = "https://openrouter.ai/api/v1/models"
url_env = "BMO_OPENROUTER_LISTING_URL"
seconds = 15

[resident]
# The keys typed into the pane of its standing program, the resident loop running one dsh child a turn, which
# reads them at its own screen as the order to end that child (docs/agent-control.md, 「Stopping」).
interrupt = ["escape"]
# The script that is the loop, by its path under the code root: a standing program started on a script of
# its file name for this provider is this provider's.
loop_script = "packages/agent/resident-loop.ts"
# Its surface carries its own turns: put into the loop's inbox and read back out of the loop's record.
turns = "loop"
# The loop runs one dsh child a turn and takes nothing while it works.
words_mid_turn = false
