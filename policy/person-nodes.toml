# The far end of the link on a person's PC (docs/person-nodes.md, 「The workplace on a PC」): the ports it
# stands on at the PC's loopback. The PC's jake agent offers the first two as stream ports and the third as
# a listen port, beside the tool host's.

# The port the link's mirror is spoken on.
mirror_port = 47201

# The port the far end joins to the node's herdr session socket.
herdr_port = 47202

# The port the stream back to the home bridge stands on, which the node's bridge socket is joined to.
bridge_port = 47203

# The first port of this machine's loopback the bridge's stream back from a PC is joined to: each PC takes the
# lowest from here no other node holds, and the hub's JAKE_REVERSE_TARGETS lists it.
bridge_relay_base = 47213

# How often a run of an account waits on its node asks again whether the node's link has been heard from, in
# seconds.
wait_seconds = 5

# The administrator's grants (docs/person-nodes.md, 「Who reaches a node」): the resources every tool session agency
# issues for a caller of the deployment's own holds, and no account's caller does. The node service's tool reads
# node.admin as reaching every node.
administrator_grants = ["node.admin"]
