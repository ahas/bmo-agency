# The workspace: the crates agency is built from under `crates/`, the tools it provides under `tools/`, and
# the repository's own package at the root, which publishes nothing and holds every test in `tests/`. The
# version is the repository's one version, in semver: the major moves on a change to the boundary API or to
# a table's contract.
[workspace]
members = [
  "crates/client",
  "crates/agent-session",
  "crates/herdr",
  "crates/agent-host",
  "crates/pane-head",
  "crates/harness-machine",
  "crates/harness-providers",
  "crates/node-link",
  "crates/llm-gateway",
  "crates/policy",
  "crates/store",
  "crates/tool-call",
  "crates/cache-siren",
  "crates/server",
  "tools/procedures",
  "tools/read_rulebook",
]
resolver = "3"

[workspace.package]
version = "0.1.0-rev.19"
edition = "2024"
license = "MIT"

[workspace.dependencies]
bmo-agency-client = { path = "crates/client" }
axum = "0.8.4"
base64 = "0.22.1"
bmo-brain-client = { path = "../brain/crates/client", version = "=0.1.0-rev.11" }
bmo-cache-warmer-schedule = { path = "../cache-warmer/schedule", version = "=0.1.0-rev.5" }
bmo-chat = { path = "../../base/chat/provider" }
bmo-node-client = { path = "../node/crates/client", version = "=0.1.0-rev.2" }
bmo-pocket-client = { path = "../pocket/client", version = "=0.1.0-rev.2" }
brush-parser = "0.4.0"
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
clap = { version = "4.5.40", features = ["derive", "env", "string"] }
diffy = "0.5.2"
dotenvy = "0.15.7"
futures-util = "0.3.34"
glob = "0.3.4"
http-body-util = "0.1.3"
hyper = { version = "1.6.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.16", features = ["tokio"] }
indexmap = { version = "2.14.2", features = ["serde"] }
inventory = "0.3.20"
libc = "0.2.177"
matchit = "0.8.4"
percent-encoding = "2.3.2"
procfs = { version = "0.18.0", default-features = false }
regex = "1.11.1"
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1.0.4"
rev_lines = "0.3.0"
sea-orm = { version = "1.1.17", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm-migration = { version = "1.1.17", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.219", features = ["derive"] }
# The OpenAPI document keeps its keys in the order the code writes them.
serde_json = { version = "1.0.138", features = ["preserve_order"] }
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["any", "postgres", "runtime-tokio"] }
sse-stream = "0.2.6"
tempfile = "3.20.0"
tokio = { version = "1.47.0", features = ["macros", "rt", "rt-multi-thread", "net", "time", "signal", "io-util", "process"] }
tokio-util = { version = "0.7.19", features = ["io"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }

[package]
name = "agency-checks"
description = "The repository's tests: each crate's behaviour and the checks that span the repository."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
agency-server = { path = "crates/server" }
bmo-agency-client = { path = "crates/client" }
agent-host = { path = "crates/agent-host" }
agent-session = { path = "crates/agent-session" }
cache-siren = { path = "crates/cache-siren" }
axum.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
harness-machine = { path = "crates/harness-machine" }
harness-providers = { path = "crates/harness-providers" }
herdr = { path = "crates/herdr" }
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
indexmap.workspace = true
libc.workspace = true
llm-gateway = { path = "crates/llm-gateway" }
node-link = { path = "crates/node-link" }
policy = { path = "crates/policy" }
procedures-tool = { path = "tools/procedures" }
read-rulebook-tool = { path = "tools/read_rulebook" }
regex.workspace = true
reqwest.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
store = { path = "crates/store" }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tool-call = { path = "crates/tool-call" }
toml.workspace = true

# Build output kept small: line tables alone for a backtrace, split out, and no incremental cache.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.release]
debug = false
strip = "debuginfo"
