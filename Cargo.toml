# The workspace: the crates agency is built from under `crates/`, and the repository's own package at the
# root, which publishes nothing and holds every test in `tests/`. The version is the repository's one
# version, in semver: the major moves on a change to the boundary API or to a table's contract.
[workspace]
members = [
  "crates/agent-session",
  "crates/herdr",
  "crates/agent-host",
  "crates/pane-head",
  "crates/harness-machine",
  "crates/harness-providers",
  "crates/node-link",
  "crates/llm-gateway",
  "crates/policy",
  "crates/store",
  "crates/server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
sea-orm = { version = "1.1.17", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm-migration = { version = "1.1.17", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
sqlx = { version = "0.8.6", default-features = false, features = ["any", "postgres", "runtime-tokio"] }
tempfile = "3.20.0"
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
tokio = { version = "1.47.0", features = ["macros", "rt", "rt-multi-thread", "net", "time", "signal", "io-util", "process"] }

[package]
name = "agency-checks"
description = "The repository's tests: each crate's behaviour and the checks that span the repository."
version.workspace = true
edition.workspace = true
publish = false

[dev-dependencies]
herdr = { path = "crates/herdr" }
policy = { path = "crates/policy" }
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde_json.workspace = true
sqlx.workspace = true
store = { path = "crates/store" }
tempfile.workspace = true
tokio.workspace = true
