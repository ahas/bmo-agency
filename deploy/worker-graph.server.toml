# The graph reads of the worker line as an external MCP server of the tool host: the graph service's own
# MCP server, listed under the worker namespace beside the queue tools (docs/worker-mcp.md).
name = "worker-graph"
namespace = "worker"
capabilities = ["graph.read"]
reached_by = "call"
timeout = 30

[stdio]
command = [
  "sh",
  "-c",
  "exec bmo-graph mcp --data-root \"$HOME/.local/share/bmo/data\" --token-file \"$HOME/.local/share/bmo/data/graph/token\"",
]
