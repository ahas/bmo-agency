# This service's standing line in every agent's brain: when to reach for it. How its tools are called is
# their manuals', handed with a tool's first call in a session.
held_by = "agency"

[[memory]]
key = "agency.when"
type = "tip"
recall_condition = "launching an item's worker run or job"
text = "Take the lease, assign_worker, then run_job; release_worker where it will not run, and stop a job only on the owner's word."

[[memory]]
key = "agency.fallback"
type = "tip"
recall_condition = "an agent's road cannot answer, adding or ordering an agent's fallback roads"
text = "An agent's fallback road is changed with agent_fallback_add, agent_fallback_remove and agent_fallback_move, and stands in only where its road cannot answer for a clear reason, never for an error a turn met."

