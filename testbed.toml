# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.

testbed = 0
name = "agency"

[test]
# The Cargo workspace's crates, the root package's test harness among them, and the TypeScript test files
# under tests/packages. Each TypeScript test file imports its setup first, so it runs from any folder; the
# bunfig.toml in tests/packages preloads the same setup for a run started there.
languages = ["cargo", "bun"]
# A release runs the TypeScript half of agency, so its packages are installed in every fresh tree.
setup = ["cd packages && bun install --frozen-lockfile"]
# The root package's test harness holds every Rust test this repository keeps, and several of its modules
# run a server against the test database; as one unit it needs more than the testbed's default guard on a
# machine carrying other work, so the guards stand above that harness's measured time here (the testbed's
# docs/suite.md, 「The guards」).
guard_seconds = 600
file_guard_seconds = 300

# The tests make their own scratch databases on the server, so no template is named.
[test.database]

# A test server reaches no peer of the deployment's. It is started with an environment built for it — no
# address or token inherited from the worker that runs the suite — and marked a test's, so every peer
# call is refused and logged; a test that needs a stand-in calls the call itself with a map of its own
# (docs/api.md, 「Calls agency makes」).

[projects]
# packages/ is the Bun workspace; its type check covers the tests under tests/packages as well.
check_script = "check:types"

[tools]
# Agency's own tools, each checked by the command its tool.toml names.
dir = "tools"

[check]
quick = ["layout", "dependencies", "cargo-profile", "shared-versions"]
base_libraries = [
  "bmo-chat",
  "bmo-chat-client",
  "bmo-gate-client",
  "bmo-ui",
  "bmo-brain-client",
  "bmo-cache-warmer-schedule",
  "bmo-node-client",
  "bmo-pocket-client",
]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

[[check.step]]
id = "check"
command = "cargo check --workspace --all-targets"
lane = "wide"

[[check.step]]
id = "clippy"
command = "cargo clippy --workspace --all-targets -- -D warnings"
lane = "wide"

[[check.step]]
id = "fmt"
command = "cargo fmt --all --check"

[build]
# The server and the verbs, the agent host and the programs it runs out of bin/, the model gateway, and
# the executables of agency's tools.
binaries = [
  "agency-server",
  "bmo-agency",
  "agent-host",
  "pane-head",
  "harness-machine",
  "harness-providers",
  "node-link",
  "llm-gateway",
  "procedures-tool",
  "worker-ask-tool",
  "delegate-tool",
]

# Agency's own deploy tree, which every unit, tool and document of agency names and which holds nothing
# of another service's, and the data root agency shares with the services that read its files
# (docs/agent-control.md, 「The job's release」). The server, the agent host and the gateway carry the
# restart mark; herdr's unit carries none, since herdr is a runtime agency stands on rather than one of
# its programs: it is hand-installed, and no deployment links or restarts it.
[deploy]
root = "~/.local/share/bmo-agency"
link = "deploy"
data_root = "~/.local/share/bmo/data"
units = ["deploy/*.service"]
# Answers 0 where no chat turn stands under way that the restart would cut: the receiver's
# own plain `quiet` command, by its deployed path, waited on before the flip (the testbed's docs/deploy.md).
# A running job is not counted: its turn in flight is kept across the restart and the lease pass takes its
# item again (docs/sessions.md, 「A restart hands the session over」).
quiet = "sh deploy/quiet"

# The worker plugin is the skills repository's worker bundle, placed over the copy the release carries by
# that repository's own placer (docs/launch-lines.md, the skills handed over as a plugin directory): from
# the skills checkout beside agency's in the workspace the checkout stands in, or the one BMO_SKILLS_DIR
# names, built into the shared Cargo target.
[[deploy.step]]
id = "place-worker-skills"
phase = "before-flip"
command = '''
set -eu
common="$(git rev-parse --path-format=absolute --git-common-dir)"
skills="${BMO_SKILLS_DIR:-$(dirname "$common")/../../resources/skills}"
target="${BMO_CARGO_TARGET_DIR:-$HOME/.local/share/bmo/cargo-target}"
cargo build --quiet --release --manifest-path "$skills/Cargo.toml" --bin bmo-skills --target-dir "$target"
"$target/release/bmo-skills" place --bundle worker --into prompts/agents/worker/plugin --from "$skills"
'''

# Each tool is placed in its folder's .placed/, the folder the tool host reads (docs/tools.md, 「A tool's
# folder」): the executable the release's bin/ holds, its manifest and the schemas beside it.
[[deploy.step]]
id = "place-procedures"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/procedures/.placed
mkdir -p tools/procedures/.placed
cp bin/procedures-tool tools/procedures/tool.toml tools/procedures/.placed/
'''

# The worker tools are placed by the operations deploy tree, not built here: the tool host is handed them
# under the worker namespace at every agency deployment, so a dsh worker's `worker` server has entries to
# open and its session starts without an mcp-worker failure (docs/worker-mcp.md).
# The graph reads are the graph service's own MCP server, registered as an external server under the
# worker namespace beside the queue tools (docs/worker-mcp.md): the host lists its tools for a worker's
# dsh session, so the namespace is never empty.
# The gateway's members: the seed of the deployment's own file, the provider APIs it serves beside the
# registry, each with the key file under the data root's env/ that holds its credential. The deployment
# places the seed only where the file is absent; a file it already holds is the deployment's and is not
# overwritten. The gateway reads the file again on each beat.
[[deploy.step]]
id = "place-gateway-members"
phase = "before-flip"
command = '''
set -eu
mkdir -p "$HOME/.local/share/bmo/data/llm-gateway"
if [ ! -e "$HOME/.local/share/bmo/data/llm-gateway/members.json" ]; then
  cp deploy/llm-gateway-members.json "$HOME/.local/share/bmo/data/llm-gateway/members.json"
fi
'''

[[deploy.step]]
id = "place-worker-graph"
phase = "after-health"
command = '''
set -eu
bmo-pocket put --mcp deploy/worker-graph.server.toml --allow graph.read --service agency
'''

[[deploy.step]]
id = "place-worker-tools"
phase = "after-health"
command = '''
set -eu
tools="$HOME/.local/share/bmo/deploy/tools"
if [ -d "$tools/todo" ]; then
  bmo-pocket put "$tools/todo" --placed --service agency \
    --allow queue.read --allow room.chat --allow room.tools --allow approve --allow file_todo
fi
'''

# Every agent's place rewritten to hand agency's tokens as the files they stand in, once the new server stands
# and has written them (docs/agent-control.md, 「A token is handed as the file it stands in」): a place no
# launch composes again keeps what it was written with otherwise. A program standing goes on as it is.
[[deploy.step]]
id = "hand-place-tokens"
phase = "after-health"
command = '''
set -eu
bin/bmo-agency hand-tokens
'''

[[deploy.step]]
id = "place-worker-ask"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/worker_ask/.placed
mkdir -p tools/worker_ask/.placed
cp bin/worker-ask-tool tools/worker_ask/tool.toml tools/worker_ask/worker_ask.json tools/worker_ask/.placed/
bmo-pocket put tools/worker_ask/.placed --placed --service agency --allow room.tools
'''

[[deploy.step]]
id = "place-delegate"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/delegate/.placed
mkdir -p tools/delegate/.placed
cp bin/delegate-tool tools/delegate/tool.toml tools/delegate/delegate.json tools/delegate/delegations.json tools/delegate/.placed/
bmo-pocket put tools/delegate/.placed --placed --service agency --allow room.tools
'''
